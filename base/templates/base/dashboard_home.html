<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VISA Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-light">

<div class="container py-5">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">Batches</h1>
    <span class="text-secondary">Newest first</span>
  </div>

  <div class="card bg-black border-secondary shadow">
    <div class="table-responsive">
      <table class="table table-dark table-hover align-middle mb-0">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Created</th>
            <th>Files</th>
            <th style="width:120px;"></th>
          </tr>
        </thead>

        <tbody>
          {% for batch in batches %}
          <tr>
            <td>#{{ batch.id }}</td>
            <td>{{ batch.created_at }}</td>
            <td>{{ batch.media_count }}</td>
            <td>
              <a href="{% url 'dashboard_batch_detail' batch.id %}" class="btn btn-sm btn-outline-light">
                View
              </a>
            </td>
          </tr>
          {% empty %}
          <tr>
            <td colspan="4" class="text-center text-secondary py-4">
              No batches yet.
            </td>
          </tr>
          {% endfor %}
        </tbody>

      </table>
    </div>
  </div>

</div>

</body>
</html>
